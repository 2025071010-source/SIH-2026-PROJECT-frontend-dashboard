<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#EEF6F0"/>
  <rect width="400" height="110" fill="#E1F0E5"/>
  <path d="M0 110 L100 80 L200 108 L300 78 L400 106 L400 110 Z" fill="#CDE7D6"/>
