    <circle cx="40" cy="150" r="9"/><circle cx="100" cy="150" r="9"/><circle cx="160" cy="150" r="9"/>
    <circle cx="220" cy="150" r="9"/><circle cx="280" cy="150" r="9"/><circle cx="340" cy="150" r="9"/>
    <!-- row 2 -->
    <circle cx="70" cy="190" r="10"/><circle cx="130" cy="190" r="10"/><circle cx="190" cy="190" r="10"/>
    <circle cx="250" cy="190" r="10"/><circle cx="310" cy="190" r="10"/><circle cx="360" cy="190" r="10"/>
    <!-- row 3 -->
    <circle cx="40" cy="230" r="11"/><circle cx="100" cy="230" r="11"/><circle cx="160" cy="230" r="11"/>
    <circle cx="220" cy="230" r="11"/><circle cx="280" cy="230" r="11"/><circle cx="340" cy="230" r="11"/>
    <!-- row 4 -->
    <circle cx="70" cy="270" r="12"/><circle cx="130" cy="270" r="12"/><circle cx="190" cy="270" r="12"/>
    <circle cx="250" cy="270" r="12"/><circle cx="310" cy="270" r="12"/>
