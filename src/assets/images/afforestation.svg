    <line x1="70" y1="190" x2="70" y2="200"/><line x1="190" y1="190" x2="190" y2="200"/><line x1="310" y1="190" x2="310" y2="200"/>
    <line x1="40" y1="230" x2="40" y2="241"/><line x1="160" y1="230" x2="160" y2="241"/><line x1="280" y1="230" x2="280" y2="241"/>
  </g>
  <text x="14" y="24" fontFamily="Inter, sans-serif" fontSize="12" fontWeight="700" fill="#1E7A5C">AFFORESTATION — Village B</text>
