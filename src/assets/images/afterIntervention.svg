    <path d="M330 183 L330 194"/>
    <path d="M190 164 L190 174"/>
  </g>
  <text x="16" y="28" fontFamily="Inter, sans-serif" fontSize="13" fontWeight="700" fill="#1E7A5C">AFTER — Jun 2026</text>
</svg>
