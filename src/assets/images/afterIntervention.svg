  <path d="M0 175 H400" stroke="#8FB688" strokeWidth="2" opacity="0.6"/>
  <path d="M0 200 H400" stroke="#8FB688" strokeWidth="2" opacity="0.6"/>
  <path d="M0 225 H400" stroke="#8FB688" strokeWidth="2" opacity="0.6"/>
  <!-- wider, healthy water body -->
  <path d="M0 250 C90 236 150 262 220 248 C290 236 340 258 400 246 L400 300 L0 300 Z" fill="#5FA0B3"/>
  <path d="M0 250 C90 236 150 262 220 248 C290 236 340 258 400 246" fill="none" stroke="#4A8A9C" strokeWidth="2" opacity="0.6"/>
  <!-- dense tree canopy clusters -->
  <g fill="#3E8E5C">
    <circle cx="55" cy="165" r="16"/>
    <circle cx="72" cy="172" r="13"/>
    <circle cx="40" cy="174" r="11"/>
  </g>
  <g fill="#3E8E5C">
    <circle cx="330" cy="168" r="15"/>
    <circle cx="348" cy="176" r="12"/>
    <circle cx="314" cy="178" r="10"/>
  </g>
  <g fill="#3E8E5C">
    <circle cx="190" cy="150" r="14"/>
    <circle cx="206" cy="158" r="11"/>
    <circle cx="176" cy="160" r="10"/>
  </g>
  <g fill="#4CA06B">
    <circle cx="120" cy="195" r="9"/>
    <circle cx="250" cy="205" r="9"/>
    <circle cx="290" cy="185" r="8"/>
  </g>
